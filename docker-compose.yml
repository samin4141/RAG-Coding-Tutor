version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=sqlite:///./data/tutor.db
      - VECTOR_STORE_PATH=./data/vector_store
    depends_on:
      - code-runner
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  code-runner:
    image: python:3.11-slim
    command: tail -f /dev/null
    volumes:
      - ./temp_code:/tmp/code
    working_dir: /tmp/code
